[project]
name = "dj-custom-starts"
version = "0.1.0"
description = "Custom Django startapp command - installs and works immediately"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dj_start = "dj_custom_starts.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dj_custom_starts"]