[project]
name = "dj-reframe"
version = "0.1.0"
description = "cria diretorios para django"
authors = [
    {name = "DougVikt"}
]
license = {text = "mit"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.4,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
dj-reframe = "dj_reframe.cli:main"