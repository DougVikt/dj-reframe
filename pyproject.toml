[project]
name = "dj-reframe"
version = "0.1.0"
description = "Advanced Django app creator with customizable architecture templates"
authors = [
    {name = "DougVikt"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "django", "cli", "startapp", "architecture",
    "drf", "api", "websockets"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities"
]

dependencies = [
    "django >=4.0"
]

[project.urls]
Repository = "https://github.com/DougVikt/dj-reframe"
Homepage = "https://github.com/DougVikt/dj-reframe"

[tool.poetry]
include = [
    "dj_reframe/app_templates/**/*"
]

[tool.poetry.dependencies]
python = "^3.10" 
django = ">=4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
ruff = "*"
mypy = "*"
pre-commit = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
dj-reframe = "dj_reframe.cli:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W","UP", "B", "SIM", "TCH"]
extend-select = ["I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true